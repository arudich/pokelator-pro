name: Agent investigation and delivery
on:
  workflow_call:
    inputs:
      source_run:
        type: string
        required: true
    secrets:
      OPENAI_API_KEY:
        required: false
      RESEND_API_KEY:
        required: true
      HEALTH_EMAIL_TO:
        required: true
      HEALTH_EMAIL_FROM:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 100
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Gather data, history, audit and failed-step logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python scripts/agent_review.py prepare --source-run "$SOURCE_RUN"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: agent-evidence
          path: review-input/
          retention-days: 90
  agent:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      outcome: ${{ steps.codex.outcome }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 100
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: agent-evidence
          path: review-input
      - name: Check whether an API key is configured
        id: key
        env:
          KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: echo "present=$KEY_PRESENT" >> "$GITHUB_OUTPUT"
      - name: Investigate data collection and mechanics
        id: codex
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 8
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: config/agent-review-prompt.md
          output-file: assessment.json
          output-schema-file: config/agent-review-schema.json
          model: ${{ vars.MONITOR_AGENT_MODEL || 'gpt-6.2-sol' }}
          effort: medium
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          allow-bots: true
          codex-args: '["--search"]'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: agent-assessment
          path: assessment.json
          if-no-files-found: ignore
          retention-days: 90
  deliver:
    needs: [prepare,agent]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: agent-evidence
          path: review-input
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: agent-assessment
          path: review-result
      - name: Email checks and assessment, including API failure notices
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_OUTCOME: ${{ needs.agent.outputs.outcome }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HEALTH_EMAIL_TO: ${{ secrets.HEALTH_EMAIL_TO }}
          HEALTH_EMAIL_FROM: ${{ secrets.HEALTH_EMAIL_FROM }}
        run: python scripts/agent_review.py deliver --outcome "$AGENT_OUTCOME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: combined-health-report
          path: review-input/combined-report.md
          retention-days: 90
