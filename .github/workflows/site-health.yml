name: Pokelator field report
on:
  schedule:
    - cron: '37 14 1,15 * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: site-health
  cancel-in-progress: false
jobs:
  report:
    if: github.repository == 'arudich/pokelator-pro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check production and email the field report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_SITE_URL: ${{ vars.HEALTH_SITE_URL }}
          USAGE_REPORT_TOKEN: ${{ secrets.USAGE_REPORT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HEALTH_EMAIL_TO: ${{ secrets.HEALTH_EMAIL_TO }}
          HEALTH_EMAIL_FROM: ${{ secrets.HEALTH_EMAIL_FROM }}
        run: python scripts/site_health.py --send
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: health-snapshot
          path: health-report/snapshot.json
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: health-report
          path: health-report/
          retention-days: 90
