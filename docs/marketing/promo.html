<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokelator · Short Promo</title><style>body{margin:0;background:#080d17;display:grid;place-items:center;min-height:100vh}canvas{height:100vh;max-width:100vw;object-fit:contain}</style><canvas id="promo" width="1080" height="1920"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false});
const W=1080,H=1920,DURATION=10,PLAYBACK_SPEED=1.15;
const colors={navy:'#101827',cyan:'#70d7ff',purple:'#aa7eff',pink:'#f08fc7',white:'#f4f7ff',muted:'#a8bbd4',green:'#9cd67f'};
const images={};
window.ready=Promise.all(['overview','battle','builder','icon'].map(async name=>{
 const image=new Image();image.src=name==='icon'?'../../assets/branding/site-icon.png':'../../assets/tutorial/'+name+'.png';await image.decode();images[name]=image;
}));
function round(x,y,w,h,r=24){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function text(value,x,y,size=40,color=colors.white,weight=800,align='left'){
 ctx.fillStyle=color;ctx.font=`${weight} ${size}px -apple-system, BlinkMacSystemFont, "Arial", sans-serif`;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(value,x,y);
}
function chip(value,x,y,color=colors.cyan,angle=0){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.font='800 30px Arial';const width=ctx.measureText(value).width+40;ctx.fillStyle=color;round(0,0,width,53,10);ctx.fill();text(value,20,37,30,colors.navy);ctx.restore();}
function sceneBase(time,index){
 ctx.fillStyle=colors.navy;ctx.fillRect(0,0,W,H);
 const glow=ctx.createRadialGradient(880,480,10,880,480,1100);glow.addColorStop(0,index%2?'#3d275b':'#173b50');glow.addColorStop(1,colors.navy);ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalAlpha=.08;ctx.strokeStyle=colors.cyan;ctx.lineWidth=1;
 for(let x=-30;x<W;x+=90){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
 for(let y=-((time*18)%90);y<H;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.restore();
}
function crop(name,source,rect,progress=0,angle=0){
 const image=images[name],scale=image.naturalWidth/1440;
 ctx.save();ctx.translate(rect.x+rect.w/2,rect.y+rect.h/2);ctx.rotate(angle);ctx.shadowColor='#0009';ctx.shadowBlur=35;ctx.shadowOffsetY=14;
 ctx.fillStyle='#172334';round(-rect.w/2,-rect.h/2,rect.w,rect.h,26);ctx.fill();ctx.shadowColor='transparent';
 round(-rect.w/2,-rect.h/2,rect.w,rect.h,26);ctx.clip();
 const zoom=1+progress*.035,sw=source.w/zoom,sh=source.h/zoom;
 ctx.drawImage(image,(source.x+(source.w-sw)/2)*scale,(source.y+(source.h-sh)/2)*scale,sw*scale,sh*scale,-rect.w/2,-rect.h/2,rect.w,rect.h);
 ctx.restore();ctx.save();ctx.translate(rect.x+rect.w/2,rect.y+rect.h/2);ctx.rotate(angle);ctx.strokeStyle='#6b8baa';ctx.lineWidth=2;round(-rect.w/2,-rect.h/2,rect.w,rect.h,26);ctx.stroke();ctx.restore();
}
function title(lines,progress,accent=colors.white){
 const enter=1-Math.pow(1-Math.min(1,progress/.12),3);ctx.save();ctx.translate(0,(1-enter)*36);ctx.globalAlpha=.2+.8*enter;
 lines.forEach((line,index)=>text(line,70,320+index*101,88,index===lines.length-1?accent:colors.white,900));ctx.restore();
}
function brand(){
 ctx.drawImage(images.icon,65,112,72,72);text('pokelator.win',155,165,47,colors.white,800);
 ctx.fillStyle=colors.cyan;round(65,1740,875,5,3);ctx.globalAlpha=.13;ctx.fill();ctx.globalAlpha=1;
}
function progressBar(t){ctx.fillStyle=colors.cyan;round(65,1740,875*Math.min(1,t/DURATION),5,3);ctx.fill();}
window.renderPromo=function(t){
 t=Math.min(DURATION-.001,Math.max(0,t));
 const starts=[0,2.6,5.1,7.6,10];let index=starts.findIndex((start,i)=>i<starts.length-1&&t>=start&&t<starts[i+1]);
 const local=t-starts[index],p=local/(starts[index+1]-starts[index]);sceneBase(t,index===3?4:index);
 if(index===0){
  title(['Battle Answers','in Seconds'],p,colors.cyan);
  chip('VIBES ARE NOT A DAMAGE CALC',70,510,colors.pink,-.025);
  crop('battle',{x:325,y:135,w:706,h:560},{x:65,y:650,w:875,h:695},p,-.012+Math.sin(p*Math.PI)*.007);
  text('Your opponent brought vibes.',70,1450,40,colors.muted,600);
  text('You brought the numbers.',70,1510,46,colors.cyan,850);
 }else if(index===1){
  title(['Build a Meta','Relevant Team'],p,colors.green);
  chip('THE RESEARCH? ALREADY DONE.',70,510,colors.green,.02);
  crop('overview',{x:735,y:232,w:670,h:480},{x:65,y:650,w:875,h:630},p,.012);
  text('Move swaps. Coverage. Actual answers.',70,1415,39,colors.muted,650);
  text('Build smarter.',70,1480,38,colors.muted,650);
  text('Be a problem.',70,1580,82,colors.green,900);
 }else if(index===2){
  title(['Investments That','Change the','Matchup'],p,colors.purple);
  const flip=local<1.25;
  crop('builder',{x:flip?34:733,y:174,w:674,h:238},{x:65,y:650,w:875,h:310},p,-.012);
  crop('builder',{x:flip?34:733,y:485,w:674,h:238},{x:65,y:1020,w:875,h:310},p,.012);
  chip(flip?'SPEED + BULK':'COVERAGE + 1v1s',110,1380,colors.purple,-.02);
  text('One stat point.',70,1480,34,colors.muted,650);
  text('Main Character Energy',70,1580,70,colors.purple,900);
 }else{
  const enter=Math.min(1,local/.3);const size=190+20*Math.sin(enter*Math.PI/2);
  ctx.save();ctx.translate(490,480);ctx.rotate(-.04+enter*.04);ctx.drawImage(images.icon,-size/2,-size/2,size,size);ctx.restore();
  text('Respectfully,',70,750,82,colors.white,850);
  text('run the numbers.',70,860,88,colors.purple,900);
  ctx.fillStyle=colors.cyan;round(65,965,875,155,24);ctx.fill();text('pokelator.win',502,1067,86,colors.navy,900,'center');
  text('Battle fast. Build better.',70,1240,49,colors.white,800);
  chip('YOUR NEXT TEAM STARTS HERE',70,1370,colors.pink,-.02);
 }
 // Brief cut flash; the URL is drawn last and remains visible on every frame.
 if(local<.065&&index>0){ctx.globalAlpha=(1-local/.065)*.12;ctx.fillStyle=colors.cyan;ctx.fillRect(0,220,W,1470);ctx.globalAlpha=1;}
 brand();progressBar(t);
};
window.recordPromo=async function(){
 await ready;renderPromo(0);
 const mime=['video/mp4;codecs=avc1.420028','video/mp4;codecs=avc1.42001E','video/mp4'].find(type=>MediaRecorder.isTypeSupported(type));
 if(!mime)throw Error('This browser cannot encode MP4');
 const stream=canvas.captureStream(30),chunks=[];
 const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:10000000});
 const stopped=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=reject;});
 recorder.ondataavailable=event=>{if(event.data.size)chunks.push(event.data);};
 recorder.start();const start=performance.now();
 await new Promise(resolve=>{function frame(now){const elapsed=(now-start)/1000*PLAYBACK_SPEED;renderPromo(elapsed);if(elapsed<DURATION)requestAnimationFrame(frame);else resolve();}requestAnimationFrame(frame);});
 recorder.stop();await stopped;stream.getTracks().forEach(track=>track.stop());
 const blob=new Blob(chunks,{type:'video/mp4'});
 const base64=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.readAsDataURL(blob);});
 return {base64,mime,width:W,height:H,audioTracks:stream.getAudioTracks().length,bytes:blob.size,playbackSpeed:PLAYBACK_SPEED};
};
ready.then(()=>{const preview=Number(new URLSearchParams(location.search).get('t') || 0);renderPromo(preview);});
</script></html>
